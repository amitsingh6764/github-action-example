services:

  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-db

    ports:
      - "1527:1521"

    environment:
      ORACLE_PASSWORD: NewPass123
      APP_USER: MYAPP
      APP_USER_PASSWORD: NewPass123

    volumes:
      - oracle-data:/opt/oracle/oradata

    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  app:
    build: .
    container_name: myapp

    ports:
      - "9908:9908"

    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle-db:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: MYAPP
      SPRING_DATASOURCE_PASSWORD: NewPass123

    depends_on:
      oracle-db:
        condition: service_healthy

volumes:
  oracle-data: